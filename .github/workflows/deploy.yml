name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        run: docker login rollhook.jkrumm.com -u jkrumm -p ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push image
        run: |
          docker build \
            -t rollhook.jkrumm.com/modelpick:${{ github.sha }} \
            -t rollhook.jkrumm.com/modelpick:latest \
            .
          docker push rollhook.jkrumm.com/modelpick:${{ github.sha }}
          docker push rollhook.jkrumm.com/modelpick:latest

      - name: Trigger RollHook deploy
        uses: jkrumm/rollhook-action@master
        with:
          service: modelpick
          image: rollhook.jkrumm.com/modelpick:${{ github.sha }}
          rollhook_url: ${{ secrets.ROLLHOOK_URL }}
          rollhook_secret: ${{ secrets.ROLLHOOK_SECRET }}
