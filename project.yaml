# How the factory ships this project (software-factory docs/project.md, the project.yaml reference).
apiVersion: factory/v2
name: modelpick
deploy:
  mode: make # `make deploy` builds the checkout and (re)loads both LaunchAgents on the mini; `make verify` probes :7727/api/health
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 0m
ship:
  - { via: push }
# One lead: `make deploy` bootouts and bootstraps the one :7727 LaunchAgent (that race can leave it down), and the daily catalog refresh commits src/db/iu-catalog.ts to master, which concurrent leads would rebase-conflict on.
leads: 1
signals:
  github:
    author: jkrumm
    since: 2026-11-07T06:30:00Z
