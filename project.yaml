# How the factory ships this project (software-factory docs/design.md §9).
apiVersion: factory/v2
name: modelpick
deploy:
  mode: make # `make deploy` builds the checkout and (re)loads both LaunchAgents on the mini; `make verify` probes :7727/stack
  targets:
    - { name: mini, host: mini, verify: make verify }
  hold: 0m
  migrations: [] # schema is `drizzle-kit push` (make db-push), no migration files
ship:
  - { paths: ["**"], via: push }
leads: 1
